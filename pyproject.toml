[project]
name = "mqmcp"
version = "0.1.0"
description = "IBM MQ MCP server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.11.0",
]

[project.scripts]
mqmcp = "mqmcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
