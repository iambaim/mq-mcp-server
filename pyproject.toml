[project]
name = "mqmcp"
version = "0.1.0"
description = "IBM MQ MCP server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx2>=2.5.0",
    "mcp[cli]>=2,<3",
]

[project.scripts]
mqmcp = "mqmcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
markers = ["integration: requires a live IBM MQ instance (deselect with '-m not integration')"]
addopts = "-m 'not integration'"
