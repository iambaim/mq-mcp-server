name: Integration Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      mq:
        # Pin to 9.3.x — MQ_ADMIN_PASSWORD env var is supported without Docker secrets.
        # Upgrade to 9.4+ requires switching to Docker secrets for admin password.
        image: icr.io/ibm-messaging/mq:9.3.5.1-r2
        env:
          LICENSE: accept
          MQ_QMGR_NAME: QM1
          MQ_ADMIN_PASSWORD: passw0rd
        ports:
          - 9443:9443
        options: >-
          --health-cmd "dspmq | grep Running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 18

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Wait for mqweb REST API
        run: |
          echo "Waiting for mqweb on https://localhost:9443..."
          for i in $(seq 1 30); do
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" \
              https://localhost:9443/ibmmq/rest/v3/admin/qmgr/ \
              -u admin:passw0rd \
              -H "ibm-mq-rest-csrf-token: token")
            if [ "$STATUS" = "200" ]; then
              echo "mqweb is ready"
              exit 0
            fi
            echo "Attempt $i/30 - status $STATUS, waiting 5s..."
            sleep 5
          done
          echo "ERROR: mqweb did not become ready in time"
          exit 1

      - name: Run integration tests
        env:
          MQ_URL_BASE: https://localhost:9443/ibmmq/rest/v3/admin/
          MQ_USERNAME: admin
          MQ_PASSWORD: passw0rd
          MQ_QMGR_NAME: QM1
        run: uv run pytest tests/test_integration.py -v -m integration
